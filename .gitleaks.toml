[extend]
useDefault = true

# manifest.json "key" is the extension's public key (it pins the extension ID); it is not a secret.
[[allowlists]]
description = "Surf extension public key"
targetRules = ["generic-api-key"]
paths = ['''^manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key": "MIIB[A-Za-z0-9+/]+={0,2}",?$''']
